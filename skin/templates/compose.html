<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" condition="!env:extwin && !env:framed" />
<roundcube:add_label name="recipientsadded" />
<roundcube:add_label name="nocontactselected" />
<roundcube:add_label name="recipient" />
<roundcube:add_label name="insert" />
<roundcube:add_label name="insertcontact" />
<roundcube:add_label name="recipientedit" />
<roundcube:add_label name="discard" />
<roundcube:add_label name="notsentwarning" />

<h1 class="voice"><roundcube:label name="compose" /></h1>

<roundcube:if condition="!env:framed && !env:extwin" />
<!-- folders list -->
<div id="layout-sidebar" class="listbox" role="navigation" aria-labelledby="aria-label-folderlist">
    <div class="header">
        <a class="button icon task-menu-button" href="#menu"><span class="inner"><roundcube:label name="menu" /></span></a>
        <span class="header-title username"><roundcube:object name="username" /></span>
        <div class="toolbar menu" role="toolbar">
            <a href="#folder-actions" class="button actions" label="actions" title="<roundcube:label name='folderactions' />" data-popup="mailboxoptions-menu">
                <span class="inner"><roundcube:label name="actions" /></span>
            </a>
        </div>
    </div>
    <h2 id="aria-label-folderlist" class="voice"><roundcube:label name="arialabelfolderlist" /></h2>
    <div id="folderlist-content" class="scroller">
        <roundcube:object name="mailboxlist" id="mailboxlist" class="treelist listing folderlist" folder_filter="mail" unreadwrap="%s" />
    </div>
    <div class="footer small">
        <roundcube:if condition="env:quota" />
            <div id="quotadisplay" class="quota-widget">
                <span class="voice"><roundcube:label name="quota"></span>
                <roundcube:object name="quotaDisplay" class="count" display="text" />
            </div>
        <roundcube:endif />
    </div>
</div>
<roundcube:endif />

<div id="layout-content" class="listbox selected gm-compose-page" role="main">
    <h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
    <div class="header gm-compose-head">
        <a class="button icon task-menu-button" href="#menu"><span class="inner"><roundcube:label name="menu" /></span></a>
        <a class="button icon back-list-button" href="#back" onclick="return UI.compose.discard()"><span class="inner"><roundcube:label name="back" /></span></a>
        <span class="header-title"><roundcube:label name="compose" /></span>
        <div id="composestatusbar" class="gm-compose-status"></div>
        <div id="messagetoolbar" class="toolbar menu" role="toolbar" aria-labelledby="aria-label-toolbar">
            <roundcube:container name="toolbar" id="compose-toolbar" />
            <roundcube:button command="extwin" type="link" class="extwin" label="openinextwin" title="openinextwin" innerclass="inner" data-hidden="small" condition="!env:extwin" />
        </div>
    </div>

    <div id="compose-content" class="formcontainer content">
        <roundcube:object name="composeFormHead" role="main" class="formcontent scroller gm-compose-form" />
        <roundcube:object name="composeObjects" id="compose-objects" class="gm-compose-objects" />

        <!-- message headers -->
        <div id="compose-headers" role="region" aria-labelledby="aria-label-composeheaders">
            <h2 id="aria-label-composeheaders" class="voice"><roundcube:label name="arialabelmessageheaders" /></h2>
            <div class="compose-headers">
                <div id="compose_from" class="gm-hrow">
                    <label for="_from" class="gm-hlabel"><roundcube:label name="from" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="from" id="_from" form="form" tabindex="1" class="form-control gm-from" />
                        <a href="#identities" onclick="return rcmail.command('switch-task', 'settings/identities')" class="gm-hlink" title="<roundcube:label name="editidents" />" tabindex="1"><roundcube:label name="editidents" /></a>
                    </div>
                </div>
                <div id="compose_to" class="gm-hrow">
                    <label for="_to" class="gm-hlabel"><roundcube:label name="to" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="to" id="_to" form="form" tabindex="1" aria-required="true" data-recipient-input="true" />
                        <a href="#add-contact" onclick="return UI.recipient_selector('to')" class="gm-hicon" title="<roundcube:label name="addcontact" />" tabindex="1"><i class="ico ico-contacts" aria-hidden="true"></i></a>
                        <span class="gm-hlinks">
                            <a href="#cc" class="gm-hlink" data-header="cc" onclick="return UI.compose.show_header('cc')"><roundcube:label name="cc" /></a>
                            <a href="#bcc" class="gm-hlink" data-header="bcc" onclick="return UI.compose.show_header('bcc')"><roundcube:label name="bcc" /></a>
                            <a href="#add-header" data-popup="headers-menu" class="gm-hicon" title="<roundcube:label name="addheader" />" tabindex="1"><i class="ico ico-more-vert" aria-hidden="true"></i></a>
                        </span>
                    </div>
                </div>
                <div id="compose_cc" class="hidden gm-hrow">
                    <label for="_cc" class="gm-hlabel"><roundcube:label name="cc" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="cc" id="_cc" form="form" tabindex="1" data-recipient-input="true" />
                        <a href="#add-contact" onclick="return UI.recipient_selector('cc')" class="gm-hicon" title="<roundcube:label name="addcontact" />" tabindex="1"><i class="ico ico-contacts" aria-hidden="true"></i></a>
                        <a href="#delete" onclick="return UI.compose.header_reset('_cc')" class="gm-hicon" title="<roundcube:label name='delete' />" tabindex="1"><i class="ico ico-close" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div id="compose_bcc" class="hidden gm-hrow">
                    <label for="_bcc" class="gm-hlabel"><roundcube:label name="bcc" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="bcc" id="_bcc" form="form" tabindex="1" data-recipient-input="true" />
                        <a href="#add-contact" onclick="return UI.recipient_selector('bcc')" class="gm-hicon" title="<roundcube:label name="addcontact" />" tabindex="1"><i class="ico ico-contacts" aria-hidden="true"></i></a>
                        <a href="#delete" onclick="return UI.compose.header_reset('_bcc')" class="gm-hicon" title="<roundcube:label name='delete' />" tabindex="1"><i class="ico ico-close" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div id="compose_replyto" class="hidden gm-hrow">
                    <label for="_replyto" class="gm-hlabel"><roundcube:label name="replyto" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="replyto" id="_replyto" form="form" tabindex="1" data-recipient-input="true" />
                        <a href="#delete" onclick="return UI.compose.header_reset('_replyto')" class="gm-hicon" title="<roundcube:label name='delete' />" tabindex="1"><i class="ico ico-close" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div id="compose_followupto" class="hidden gm-hrow">
                    <label for="_followupto" class="gm-hlabel"><roundcube:label name="followupto" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeHeaders" part="followupto" id="_followupto" form="form" tabindex="1" data-recipient-input="true" />
                        <a href="#delete" onclick="return UI.compose.header_reset('_followupto')" class="gm-hicon" title="<roundcube:label name='delete' />" tabindex="1"><i class="ico ico-close" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div id="compose_subject" class="gm-hrow">
                    <label for="compose-subject" class="gm-hlabel voice"><roundcube:label name="subject" /></label>
                    <div class="gm-hfield">
                        <roundcube:object name="composeSubject" id="compose-subject" form="form" tabindex="1" class="form-control gm-subject" placeholder="Subject" />
                    </div>
                </div>
            </div>
        </div>

        <!-- message body -->
        <div id="composebodycontainer">
            <label for="composebody" class="voice"><roundcube:label name="arialabelmessagebody" /></label>
            <roundcube:object name="composeBody" id="composebody" form="form" cols="70" rows="20" class="form-control" tabindex="1" />
            <roundcube:if condition="!in_array('htmleditor', (array)config:dont_override)" />
            <roundcube:object name="editorSelector" id="editor-selector" editorid="composebody" noform="true" class="hidden" />
            <roundcube:endif />
        </div>

        <!-- attachments -->
        <div id="compose-attachments" class="file-upload gm-attachments" role="region" aria-labelledby="aria-label-compose-attachments">
            <h2 id="aria-label-compose-attachments" class="voice"><roundcube:label name="attachments" /></h2>
            <roundcube:object name="composeAttachmentList" id="attachment-list" class="attachmentslist" tabindex="2" />
            <roundcube:object name="fileDropArea" id="compose-attachments" />
        </div>
        </form>

        <!-- bottom action bar (Gmail) -->
        <div class="formbuttons gm-compose-bar" role="toolbar">
            <span class="gm-send-group">
                <roundcube:button command="send" class="gm-btn gm-btn-filled gm-send" label="send" tabindex="1" data-content-button="true" />
                <a href="#send-options" class="gm-send-more" data-popup="send-menu" tabindex="1" title="<roundcube:label name="options" />"><i class="ico ico-arrow-drop-down" aria-hidden="true"></i></a>
            </span>
            <div class="toolbar menu gm-compose-tools">
                <a href="#format" class="format" title="<roundcube:label name="htmltoggle" />" onclick="return UI.compose.toggle_toolbar()" tabindex="2"><span class="inner"><roundcube:label name="htmltoggle" /></span></a>
                <roundcube:button name="addattachment" type="link" class="attach" label="attach" title="addattachment"
                    onclick="if (!this.classList.contains('disabled')) rcmail.upload_input('uploadform')" aria-haspopup="true" tabindex="2" innerclass="inner" />
                <roundcube:button command="insert-sig" type="link" class="signature disabled" classAct="signature" label="signature" title="insertsignature" tabindex="2" innerclass="inner" />
                <a href="#responses" class="responses" title="<roundcube:label name='insertresponse' />" tabindex="2" data-popup="responses-menu"><span class="inner"><roundcube:label name="responses" /></span></a>
                <roundcube:if condition="!empty(env:spell_langs)" />
                <span class="dropbutton">
                    <roundcube:button command="spellcheck" type="link" class="spellcheck disabled" classAct="spellcheck" classSel="spellcheck pressed"
                        label="spellcheck" title="checkspelling" tabindex="2" innerclass="inner" />
                    <a href="#languages" class="dropdown" tabindex="2" data-popup="spell-menu"><span class="inner"><roundcube:label name="language" /></span></a>
                </span>
                <roundcube:endif />
                <span class="dropbutton" style="display:none">
                    <roundcube:button command="compose-encrypted" type="link" class="encrypt disabled" classAct="encrypt" classSel="encrypt selected" innerclass="inner"
                        label="encrypt" title="encryptmessagemailvelope" tabindex="2" />
                    <a href="#encryption" id="encryption-menu-button" class="dropdown" tabindex="2" data-popup="encryption-menu"><span class="inner"><roundcube:label name="encryptmessagemailvelope" /></span></a>
                </span>
                <a href="#options" class="more" title="<roundcube:label name="options" />" data-popup="compose-options-menu" tabindex="2"><span class="inner"><roundcube:label name="options" /></span></a>
            </div>
            <roundcube:button command="savedraft" type="link" class="button icon save draft disabled" classAct="button icon save draft" label="save" title="savemessage" tabindex="2" innerclass="inner" />
            <a href="#discard" class="button icon delete gm-discard" title="<roundcube:label name="discard" />" onclick="return UI.compose.discard()" tabindex="2"><span class="inner"><roundcube:label name="discard" /></span></a>
        </div>
    </div>
</div>

<roundcube:object name="composeAttachmentForm" id="uploadform" mode="smart" />

<!-- options: Gmail's "More options" — receipt, DSN, priority, save-to folder, keep formatting -->
<div id="compose-options-menu" class="popupmenu propform gm-compose-options" data-align="right" role="dialog" aria-labelledby="aria-label-composeoptions">
    <h3 id="aria-label-composeoptions" class="voice"><roundcube:label name="arialabelcomposeoptions" /></h3>
    <div id="compose-options" class="formcontent">
        <roundcube:container name="composeoptions" id="compose-options" />
        <roundcube:if condition="!in_array('mdn_default', (array)config:dont_override)" />
        <div class="form-group row form-check">
            <label for="compose-mdn" class="col-form-label"><roundcube:label name="returnreceipt" /></label>
            <roundcube:object name="mdnCheckBox" id="compose-mdn" noform="true" tabindex="2" class="form-check-input gm-switch" />
        </div>
        <roundcube:endif />
        <roundcube:if condition="!in_array('dsn_default', (array)config:dont_override)" />
        <div class="form-group row form-check">
            <label for="compose-dsn" class="col-form-label"><roundcube:label name="dsn" /></label>
            <roundcube:object name="dsnCheckBox" id="compose-dsn" noform="true" tabindex="2" class="form-check-input gm-switch" />
        </div>
        <roundcube:endif />
        <roundcube:if condition="!in_array('keep_formatting_default', (array)config:dont_override)" />
        <div class="form-group row form-check">
            <label for="compose-keep-formatting" class="col-form-label"><roundcube:label name="keepformatting" /></label>
            <roundcube:object name="keepFormattingCheckBox" id="compose-keep-formatting" noform="true" tabindex="2" class="form-check-input gm-switch" />
        </div>
        <roundcube:endif />
        <div class="form-group row">
            <label for="compose-priority" class="col-form-label"><roundcube:label name="priority" /></label>
            <roundcube:object name="prioritySelector" id="compose-priority" noform="true" tabindex="2" class="custom-select" />
        </div>
        <roundcube:if condition="!config:no_save_sent_messages" />
        <div class="form-group row">
            <label for="compose-store-target" class="col-form-label"><roundcube:label name="savesentmessagein" /></label>
            <roundcube:object name="storetarget" id="compose-store-target" noform="true" tabindex="2" class="custom-select" />
        </div>
        <roundcube:endif />
    </div>
</div>

<div id="send-menu" class="popupmenu" data-align="left">
    <ul class="menu listing" role="menu">
        <roundcube:button command="savedraft" type="link-menuitem" label="save" class="save disabled" classAct="save active" />
        <roundcube:container name="sendmenu" id="send-menu" />
    </ul>
</div>

<div id="spell-menu" class="popupmenu" data-popup-init="spellmenu"></div>

<div id="headers-menu" class="popupmenu" data-popup-init="headersmenu">
    <h3 id="aria-label-headersmenu" class="voice"><roundcube:label name="arialabelheadersmenu" /></h3>
    <ul class="menu listing" role="menu" aria-labelledby="aria-label-headersmenu">
        <li role="menuitem"><a data-target="cc" href="#" role="button" tabindex="-1" class="recipient active" onclick="return UI.compose.show_header('cc')"><roundcube:label name="cc" /></a></li>
        <li role="menuitem"><a data-target="bcc" href="#" role="button" tabindex="-1" class="recipient active" onclick="return UI.compose.show_header('bcc')"><roundcube:label name="bcc" /></a></li>
        <li role="menuitem"><a data-target="replyto" href="#" role="button" tabindex="-1" class="recipient active" onclick="return UI.compose.show_header('replyto')"><roundcube:label name="replyto" /></a></li>
        <li role="menuitem"><a data-target="followupto" href="#" role="button" tabindex="-1" class="recipient active" onclick="return UI.compose.show_header('followupto')"><roundcube:label name="followupto" /></a></li>
    </ul>
</div>

<div id="responses-menu" class="popupmenu">
    <h3 id="aria-label-responsesmenu" class="voice"><roundcube:label name="arialabelresponsesmenu" /></h3>
    <ul class="menu listing" role="menu" aria-labelledby="aria-label-responsesmenu">
        <li role="separator" class="separator"><label><roundcube:label name="insertresponse" /></label></li>
        <roundcube:object name="responseslist" id="responseslist" tagname="ul" class="rounded-0" itemclass="active" list-placeholder="noresponsesavailable" />
        <li role="separator" class="separator"><label><roundcube:label name="manageresponses" /></label></li>
        <roundcube:button name="responses" type="link-menuitem" label="editresponses" class="edit responses active" onclick="return rcmail.command('switch-task', 'settings/responses')" />
    </ul>
</div>

<div id="attachmentmenu" class="popupmenu">
    <h3 id="aria-label-attachmentmenu" class="voice"><roundcube:label name="arialabelattachmentmenu" /></h3>
    <ul class="menu listing" role="menu" aria-labelledby="aria-label-attachmentmenu">
        <roundcube:button command="open-attachment" id="attachmenuopen" type="link-menuitem" label="open" class="extwin disabled" classAct="extwin active" />
        <roundcube:button command="download-attachment" id="attachmenudownload" type="link-menuitem" label="download" class="download disabled" classAct="download active" />
        <roundcube:button command="rename-attachment" id="attachmenurename" type="link-menuitem" label="rename" class="rename disabled" classAct="rename active" />
        <roundcube:container name="attachmentmenu" id="attachmentoptionsmenu" />
    </ul>
</div>

<div id="encryption-menu" class="popupmenu">
    <ul class="menu listing" role="menu">
        <roundcube:button command="compose-encrypted" type="link-menuitem" label="encryptmessage" class="encrypt disabled" classAct="encrypt active" />
        <roundcube:button command="compose-encrypted-signed" type="link-menuitem" label="encryptandsign" class="encrypt sign disabled" classAct="encrypt sign active" />
    </ul>
</div>

<div id="recipient-dialog" class="popupmenu" role="region" aria-labelledby="aria-label-composecontacts">
    <div class="listbox">
        <roundcube:object name="searchform" id="searchform" wrapper="searchbar menu gm-search gm-search-sm"
            label="contactsearchform" buttontitle="findcontacts" ariatag="h2" class="no-bs" />
        <div class="scroller" tabindex="-1">
            <roundcube:object name="addressbooks" id="directorylist" class="treelist listing iconized" summary="ariasummarycomposecontacts" />
            <roundcube:object name="addresslist" id="contacts-table" class="listing iconized contactlist"
                noheader="true" role="listbox" data-list="contact_list" data-list-select-replace="#recipient-dialog .pagenav-text" />
        </div>
        <roundcube:include file="includes/pagenav.html" />
    </div>
</div>

<roundcube:include file="includes/footer.html" />
